<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Color Flipper</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      transition: background-color 0.3s ease;
    }
    .card {
      background: white;
      padding: 2rem 3rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      text-align: center;
    }
    button {
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      cursor: pointer;
      border: none;
      border-radius: 4px;
      background-color: #333;
      color: white;
      margin-top: 1rem;
    }
    button:hover {
      background-color: #555;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Background Color: <span id="color-text">#FFFFFF</span></h2>
    <button id="btn">Flip Color</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
